name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID that already uploaded desktop artifacts
        required: true
      tag_name:
        description: Release tag to create or update, for example v0.1.0
        required: true
      target_sha:
        description: Commit SHA for a new tag. Leave empty to use the default branch.
        required: false
      draft:
        description: Create the release as a draft
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish existing artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts from completed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DRAFT_RELEASE: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find artifacts -type f \( \
              -name '*.deb' -o \
              -name '*.pkg.tar.zst' -o \
              -name '*.AppImage' -o \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*.msi' -o \
              -name '*.exe' \
            \) -print0 | sort -z
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop artifacts found in run $RUN_ID."
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          args=(release create "$TAG_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Rorilo $TAG_NAME" --notes "Desktop builds for Rorilo.")

          if [ "$DRAFT_RELEASE" = "true" ]; then
            args+=(--draft)
          fi

          if [ -n "$TARGET_SHA" ]; then
            args+=(--target "$TARGET_SHA")
          fi

          gh "${args[@]}"
