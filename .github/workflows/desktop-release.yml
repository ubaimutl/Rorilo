name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-14

    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npm run release:check

      - run: npx prisma generate

      - run: npm test

      - run: npm run build

      - run: npm run desktop:bundle-server

      - run: npm run desktop:test-upgrades

      - run: npm run desktop:prepare-node

      - run: npm run desktop:test-database

      - name: Test Linux database with OpenSSL 1.1 and 3
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for image in node:22-bullseye node:22-bookworm; do
            docker run --rm --network none --volume "$PWD:/workspace:ro" "$image" \
              node /workspace/scripts/test-desktop-database.mjs /workspace/src-tauri/resources
          done

      - name: Build desktop app
        run: npm run desktop:package-native

      - name: Test desktop startup and database upgrades
        run: cargo test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Test database in extracted Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimage[@]}" -eq 1
          appimage_path="$(realpath "${appimage[0]}")"
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          (cd "$test_dir" && "$appimage_path" --appimage-extract > /dev/null)
          appdir="$test_dir/squashfs-root"
          LD_LIBRARY_PATH="$appdir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            node scripts/test-desktop-database.mjs "$appdir/usr/lib/Rorilo/resources"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rorilo-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  release:
    name: Create draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Rorilo ${{ github.ref_name }}
          body_path: releases/${{ github.ref_name }}.md
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
